apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-controller-sa
  labels:
    app: gitops-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-controller-role
  labels:
    app: gitops-controller
rules:
- apiGroups: ["apps"] # Permissions for Deployment resources
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"] # Required for monitoring and triggering rollbacks
- apiGroups: [""] # Permissions for Pods (optional, but good for richer monitoring)
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-controller-rolebinding
  labels:
    app: gitops-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitops-controller-role
subjects:
- kind: ServiceAccount
  name: gitops-controller-sa
  namespace: default # Ensure this matches the namespace where your controller is deployed