
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-controller-sa
  namespace: default # Or the namespace where your controller will run
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-controller-role
  namespace: default # Must match the ServiceAccount namespace
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-controller-rolebinding
  namespace: default # Must match the ServiceAccount namespace
spec:
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: gitops-controller-role
  subjects:
  - kind: ServiceAccount
    name: gitops-controller-sa
    namespace: default # Must match the ServiceAccount namespace
