apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-nginx
  labels:
    app: dummy-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-nginx
  template:
    metadata:
      labels:
        app: dummy-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest # A simple Nginx image for testing
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-nginx-service
  labels:
    app: dummy-nginx
spec:
  selector:
    app: dummy-nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP # Use ClusterIP for internal service access