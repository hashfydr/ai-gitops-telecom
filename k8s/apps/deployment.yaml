
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-controller-deployment
  labels:
    app: gitops-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-controller
  template:
    metadata:
      labels:
        app: gitops-controller
    spec:
      serviceAccountName: gitops-controller-sa
      containers:
      - name: gitops-controller
        image: gitops-controller:latest # This image needs to be built and pushed to Minikube or a registry
        imagePullPolicy: Never # Use Never for local Minikube builds, Always for remote registries
        ports:
        - containerPort: 8080 # Assuming your controller exposes a port, adjust if not
